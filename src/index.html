<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>我的服务</title>

  <style>
    :root {
      --spacing: 0.25rem;
      --container: 1600px;
      --card: rgba(255, 255, 255, 0.92);
      --card-muted: #f4f4f5;
      --border: rgba(24, 24, 27, 0.12);
      --foreground: #18181b;
      --muted: #71717a;
      --hover: rgba(24, 24, 27, 0.04);
      --accent: #2563eb;
      color-scheme: light;
    }

    :root.dark {
      --card: rgba(24, 25, 26, 0.92);
      --card-muted: #202122;
      --border: rgba(255, 255, 255, 0.12);
      --foreground: #f4f4f5;
      --muted: #a1a1aa;
      --hover: rgba(255, 255, 255, 0.045);
      --accent: #60a5fa;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent !important;
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: 100%;
    }

    @media (min-width: 26.6rem) {
      .container {
        max-width: 26.6rem;
      }
    }

    @media (min-width: 28rem) {
      .container {
        max-width: 28rem;
      }
    }

    @media (min-width: 40rem) {
      .container {
        max-width: 40rem;
      }
    }

    @media (min-width: 48rem) {
      .container {
        max-width: 48rem;
      }
    }

    @media (min-width: 53rem) {
      .container {
        max-width: 53rem;
      }
    }

    @media (min-width: 64rem) {
      .container {
        max-width: 64rem;
      }
    }

    @media (min-width: 80rem) {
      .container {
        max-width: 80rem;
      }
    }

    @media (min-width: 90rem) {
      .container {
        max-width: 90rem;
      }
    }

    .dashboard {
      height: 100vh;
      margin: 0 auto;
      padding: 1rem;
    }

    .topology-card {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .topology-header {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.5rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .topology-heading {
      min-width: 0;
    }

    .topology-heading h1 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .topology-heading p,
    .topology-help {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .topology-help {
      flex: 0 0 auto;
      text-align: right;
    }

    #topology {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
    }

    #topology:active {
      cursor: grabbing;
    }

    @keyframes beszel-edge-flow {
      to {
        stroke-dashoffset: -26;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #topology path {
        animation: none !important;
      }
    }

    .dashboard-message {
      position: absolute;
      top: 5.25rem;
      left: 50%;
      z-index: 5;
      max-width: calc(100% - 2rem);
      padding: 0.55rem 0.8rem;
      transform: translateX(-50%);
      border: 1px solid color-mix(in srgb, #f59e0b 40%, transparent);
      border-radius: 0.6rem;
      background: color-mix(in srgb, #f59e0b 12%, var(--card));
      color: var(--foreground);
      font-size: 0.78rem;
      text-align: center;
    }

    .dashboard-message.error {
      border-color: color-mix(in srgb, #ef4444 45%, transparent);
      background: color-mix(in srgb, #ef4444 12%, var(--card));
    }

    .dashboard-message[hidden] {
      display: none;
    }

    @media (max-width: 40rem) {
      .dashboard {
        padding: 0.5rem;
      }

      .topology-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .topology-help {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="container dashboard">
    <section class="topology-card" aria-labelledby="topology-title">
      <header class="topology-header">
        <div class="topology-heading">
          <h1 id="topology-title">服务拓扑</h1>
          <p id="topology-summary">正在读取系统和容器…</p>
        </div>
        <p class="topology-help">拖动画布 · Ctrl/⌘ + 滚轮缩放 · 点击系统进入详情</p>
      </header>
      <div id="topology" role="img" aria-label="系统与容器服务拓扑图"></div>
      <div id="dashboard-message" class="dashboard-message" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="./lib/x6.min.js"></script>
  <script src="./x6.js?v=20261104-x6-v5"></script>
  <script>
    (() => {
      "use strict";

      const ROOT_NAME = "xcloud";
      const REFRESH_INTERVAL = 60_000;
      const SYSTEM_FIELDS = "id,name,host,port,info,status";
      const CONTAINER_FIELDS =
        "id,name,image,updatable,ports,cpu,memory,net,health,status,system,updated";

      let loading = false;
      let lastSystems = [];
      let lastContainers = [];

      const topologyElement = document.getElementById("topology");
      const summaryElement = document.getElementById("topology-summary");
      const messageElement = document.getElementById("dashboard-message");

      function showMessage(message = "", type = "warning") {
        messageElement.textContent = message;
        messageElement.classList.toggle("error", type === "error");
        messageElement.hidden = !message;
      }


      function getAuthToken() {
        const stored = localStorage.getItem("pocketbase_auth");
        if (!stored) return "";
        try {
          return JSON.parse(stored)?.token || "";
        } catch {
          return "";
        }
      }

      async function fetchCollection(collection, params) {
        const token = getAuthToken();
        if (!token) {
          throw new Error("未找到 Beszel 登录信息，请刷新主页面后重试。");
        }

        const response = await fetch(
          `/api/collections/${collection}/records?${params.toString()}`,
          {
            credentials: "same-origin",
            headers: { Authorization: token },
          },
        );

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            throw new Error("登录状态已失效，请重新登录 Beszel。");
          }
          throw new Error(`读取 ${collection} 失败（HTTP ${response.status}）。`);
        }

        const data = await response.json();
        return Array.isArray(data.items) ? data.items : [];
      }


      function render(systems, containers) {
        lastSystems = systems;
        lastContainers = containers;

        const result = window.BeszelTopology.render({
          container: topologyElement,
          rootName: ROOT_NAME,
          systems,
          containers,
        });

        summaryElement.textContent =
          `${result.systems} 个系统 · ${result.containers} 个容器 · 根节点 ${ROOT_NAME}`;

        if (!result.rootFound) {
          showMessage(`未找到名称为“${ROOT_NAME}”的系统，当前使用同名虚拟根节点。`);
        } else if (result.unassigned) {
          showMessage(`${result.unassigned} 个容器没有有效的 system 关联，已归入“未分配”。`);
        } else {
          showMessage();
        }
      }

      async function loadDashboard() {
        if (loading) return;
        loading = true;
        summaryElement.textContent = "正在读取系统和容器…";

        try {
          const systemParams = new URLSearchParams({
            page: "1",
            perPage: "500",
            skipTotal: "1",
            sort: "+name",
            fields: SYSTEM_FIELDS,
          });
          const containerParams = new URLSearchParams({
            page: "0",
            perPage: "2000",
            fields: CONTAINER_FIELDS,
          });
          const [systems, containers] = await Promise.all([
            fetchCollection("systems", systemParams),
            fetchCollection("containers", containerParams),
          ]);
          render(systems, containers);
        } catch (error) {
          console.error("加载服务拓扑失败", error);
          summaryElement.textContent = "服务拓扑加载失败";
          showMessage(error?.message || "读取系统和容器失败。", "error");
        } finally {
          loading = false;
        }
      }

      new MutationObserver(() => {
        if (lastSystems.length || lastContainers.length) {
          render(lastSystems, lastContainers);
        }
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadDashboard();
      });
      window.setInterval(loadDashboard, REFRESH_INTERVAL);
      loadDashboard();
    })();
  </script>
</body>

</html>
